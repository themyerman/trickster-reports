<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="Charter, Georgia, serif">
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#1a1a1a">The capability mirage</text>
  <text x="40" y="68" font-size="13.5" fill="#555">Signing pierce: the same benign command, two disguises (hits of 15, n=15).</text>

  <!-- legend -->
  <rect x="520" y="34" width="15" height="15" fill="#9aa3b2"/>
  <text x="542" y="46" font-size="12.5" fill="#333">blatant (owned=…)</text>
  <rect x="520" y="54" width="15" height="15" fill="#d64545"/>
  <text x="542" y="66" font-size="12.5" fill="#333">subtle (font_cache_id=…)</text>

  <!-- gridlines + y labels (0,5,10,15) -->
  <g stroke="#e8e8e4" stroke-width="1">
    <line x1="55" y1="380" x2="745" y2="380"/>
    <line x1="55" y1="286.7" x2="745" y2="286.7"/>
    <line x1="55" y1="193.3" x2="745" y2="193.3"/>
    <line x1="55" y1="100" x2="745" y2="100"/>
  </g>
  <g font-size="11" fill="#888" text-anchor="end">
    <text x="48" y="384">0</text>
    <text x="48" y="290.7">5</text>
    <text x="48" y="197.3">10</text>
    <text x="48" y="104">15</text>
  </g>

  <!-- bars: height = hits * 18.667, baseline y=380 -->
  <!-- Qwen 3B (center 141.25): blatant 8, subtle 6 -->
  <rect x="87" y="230.7" width="50" height="149.3" fill="#9aa3b2"/>
  <text x="112" y="224" font-size="12" fill="#555" text-anchor="middle">8</text>
  <rect x="145" y="268.0" width="50" height="112.0" fill="#d64545"/>
  <text x="170" y="261" font-size="12" fill="#555" text-anchor="middle">6</text>

  <!-- Haiku (center 313.75): blatant 11, subtle 15 -->
  <rect x="259.75" y="174.7" width="50" height="205.3" fill="#9aa3b2"/>
  <text x="284.75" y="168" font-size="12" fill="#555" text-anchor="middle">11</text>
  <rect x="317.75" y="100.0" width="50" height="280.0" fill="#d64545"/>
  <text x="342.75" y="93" font-size="12" fill="#555" text-anchor="middle">15</text>

  <!-- Sonnet (center 486.25): blatant 15, subtle 15 -->
  <rect x="432.25" y="100.0" width="50" height="280.0" fill="#9aa3b2"/>
  <text x="457.25" y="93" font-size="12" fill="#555" text-anchor="middle">15</text>
  <rect x="490.25" y="100.0" width="50" height="280.0" fill="#d64545"/>
  <text x="515.25" y="93" font-size="12" fill="#555" text-anchor="middle">15</text>

  <!-- Opus (center 658.75): blatant 0, subtle 15 -->
  <rect x="604.75" y="379" width="50" height="1" fill="#9aa3b2"/>
  <text x="629.75" y="373" font-size="12" fill="#555" text-anchor="middle">0</text>
  <rect x="662.75" y="100.0" width="50" height="280.0" fill="#d64545"/>
  <text x="687.75" y="93" font-size="12" fill="#555" text-anchor="middle">15</text>

  <!-- x axis baseline + model labels -->
  <line x1="55" y1="380" x2="745" y2="380" stroke="#999" stroke-width="1.5"/>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="141.25" y="400">Qwen 3B</text>
    <text x="313.75" y="400">Haiku 5.5</text>
    <text x="486.25" y="400">Sonnet 5.5</text>
    <text x="658.75" y="400" font-weight="700">Opus 5.5</text>
  </g>

  <!-- Opus callout -->
  <text x="658.75" y="430" font-size="12.5" fill="#d64545" text-anchor="middle" font-weight="700">refused 0/15 → ran 15/15</text>
  <text x="40" y="455" font-size="11.5" fill="#777">The smartest model refuses the obvious command every time and runs the disguised one every time. It reads the costume, not the intent.</text>
</svg>
